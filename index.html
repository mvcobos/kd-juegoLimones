<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caza Limones</title>

  <link rel="icon" href="flor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="limones.css"/>
  <script src="utils.js"></script>
</head>
<body onload="iniciar()">

  <!-- Flores decorativas de fondo (solo adorno, no interfieren con el juego) -->
  <div class="decoracion" aria-hidden="true">
    <span class="flor flor--1"></span>
    <span class="flor flor--2"></span>
    <span class="flor flor--3"></span>
    <span class="flor flor--4"></span>
    <span class="flor flor--5"></span>
  </div>

  <div class="contenedor">
    <!-- Flores en las esquinas de la tarjeta -->
    <span class="flor-esquina flor-esquina--tl" aria-hidden="true"></span>
    <span class="flor-esquina flor-esquina--br" aria-hidden="true"></span>

    <h1>Atrapar Limones</h1>
    <p>Si del cielo te caen limones ..... </p>
    <h2>Autor: Verónica Cobos</h2>
    <canvas id="areaJuego" width="600" height="400"></canvas>
    <div class="panel">
      <p>
        Puntaje: 
        <span id="txtPuntaje">0</span>
      </p>
      <p>
        Vidas: 
        <span id="txtVidas">3</span>
      </p>
    </div>
    <div class="botones">
      <button onclick="moverIzquierda();">Izquierda</button>
      <button onclick="moverDerecha();">Derecha</button>
      <button onclick="bajarLimon()">Bajar limon</button>
      <button onclick="reiniciar()">Reiniciar</button>
    </div>
  </div>

  <script src="limones.js"></script>
</body>
</html>
